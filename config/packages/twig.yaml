twig:
    file_name_pattern: '*.twig'

    # The hospital works in India Standard Time.
    date:
        timezone: 'Asia/Kolkata'

    # Makes the signed-in username available in Twig templates.
    globals:
        auth: '@App\Service\AuthSessionService'

        # Shown on printed invoices. EDIT THESE VALUES to your hospital's details.
        hospital:
            name: 'Hospital Management System'
            address: ''
            phone: ''
            email: ''
            currency: '₹'

when@test:
    twig:
        strict_variables: true